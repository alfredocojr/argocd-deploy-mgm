apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-demo
  labels:
    app: todos-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: todos-demo
  template:
    metadata:
      labels:
        app: todos-demo
    spec:
      containers:
        - name: todos
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.port }}  
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /todos
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
